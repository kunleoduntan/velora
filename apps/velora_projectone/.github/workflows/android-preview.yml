name: ProjectOne Mobile Android Preview

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_PROJECTONE_API_BASE: ${{ vars.EXPO_PUBLIC_PROJECTONE_API_BASE }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Verify release environment
        working-directory: mobile
        run: npm run check:release-env

      - name: Verify application configuration
        working-directory: mobile
        run: npm run check:build-config

      - name: Run automated tests
        working-directory: mobile
        run: npm test

      - name: Typecheck application
        working-directory: mobile
        run: npm run typecheck

      - name: Validate EAS credentials and project linkage
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing EXPO_TOKEN secret"; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo "Missing EXPO_PROJECT_ID repository variable"; exit 1; }
          test -n "$EXPO_PUBLIC_PROJECTONE_API_BASE" || { echo "Missing EXPO_PUBLIC_PROJECTONE_API_BASE repository variable"; exit 1; }

      - name: Build internal Android APK with EAS
        working-directory: mobile
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive
