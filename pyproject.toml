[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velora"
dynamic = ["version"]
description = "Velora - a metadata-driven enterprise application framework"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0", "fastapi>=0.110", "uvicorn>=0.29", "xlsxwriter>=3.1", "cryptography>=42", "packaging>=23", "jinja2>=3.1", "openpyxl>=3.1", "tomli>=2.0; python_version < \"3.11\""]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
oracle = ["oracledb>=2.0"]
# Optional capabilities (kept OUT of the core so a plain install stays small and always installs). `velora deps list` shows what each needs.
data = ["numpy>=1.26", "pandas>=2.1", "python-dateutil>=2.8", "pytz>=2023.3"]
pdf = ["reportlab>=4.0", "qrcode[pil]>=7.4", "pillow>=10.0"]
ml = ["scikit-learn>=1.4", "statsmodels>=0.14", "numpy>=1.26", "pandas>=2.1"]
forecast = ["prophet>=1.1", "statsmodels>=0.14", "pandas>=2.1"]
markets = ["yfinance>=0.2.40"]
sftp = ["paramiko>=3.4"]
security = ["bcrypt>=4.1"]
all = ["psycopg[binary]>=3.1", "numpy>=1.26", "pandas>=2.1", "python-dateutil>=2.8", "pytz>=2023.3", "reportlab>=4.0", "qrcode[pil]>=7.4", "pillow>=10.0",
       "scikit-learn>=1.4", "statsmodels>=0.14", "prophet>=1.1", "yfinance>=0.2.40", "paramiko>=3.4", "bcrypt>=4.1"]
dev = ["pytest", "httpx", "openpyxl", "tomli>=2.0; python_version < \"3.11\""]

[project.scripts]
velora = "velora.cli:main"

[tool.setuptools.dynamic]
version = {attr = "velora.__version__"}      # ONE place to change the version: velora/__init__.py

[tool.setuptools.packages.find]
include = ["velora*"]

[tool.setuptools.package-data]
velora = ["desk/*", "desk/assets/*", "theme/presets.json", "patches.txt", "static/*.html"]
velora_notify = ["notify/doctype/*/*.json", "broadcast/doctype/*/*.json", "broadcast/doctype/*/*.js", "patches.txt"]
velora_search = ["search/doctype/*/*.json", "patches.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/velora_demo", "apps/velora_accounts", "apps/velora_erp", "."]
filterwarnings = ["ignore:Dialect sqlite.*Decimal"]
