# docker compose -f deploy/docker-compose.yml up -d
# Put nginx/Caddy/Traefik (with TLS) in front; forward the Host header.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  velora:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      VELORA_DB_HOST: db
      VELORA_DB_ROOT_PASSWORD: ${POSTGRES_PASSWORD}      # lets `velora new-site` create a role + database per site
    volumes: [ "workspace:/workspace" ]
    ports: [ "127.0.0.1:8000:8000" ]
volumes: { pgdata: {}, workspace: {} }
