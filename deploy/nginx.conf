# Reverse proxy for Velora. The Host header MUST be forwarded: it is how Velora picks the site.
# Replace erp.example.com; for many client domains use a wildcard server_name and wildcard certificate.
upstream velora { server 127.0.0.1:8000; keepalive 16; }

server {
    listen 80;
    server_name erp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.example.com;
    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;   # certbot --nginx -d erp.example.com
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;

    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://velora;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;                       # <-- selects the Velora site
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                           # large Excel exports
    }
}
